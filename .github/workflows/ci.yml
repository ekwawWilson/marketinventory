name: CI

on:
  push:
    # `staging` builds the demo image. The publish job already trusts this ref;
    # without it here the workflow simply never runs on that branch, so the
    # `:staging` tag the fleet manifest pins would never exist.
    #
    # Safe because the migrate job is pinned to main — a staging push must never
    # run migrations against the production Neon database.
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are worth cancelling. A main run is not — cancelling it
  # mid-`deploy` could abort the job between `migrate deploy` and the container
  # swap, leaving a migrated database in front of the old build.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    env:
      # Placeholders only — CI never touches a real database. `next build` needs
      # these to be present and well-formed, not to be reachable.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-placeholder-secret-that-is-long-enough-000
      NEXTAUTH_URL: http://localhost:3000
      R2_ACCOUNT_ID: ci
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
      R2_BUCKET: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate environment schema
        run: npm run check:env

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production dependencies only — dev-tool advisories do not ship to users.
      # xlsx has no upstream fix on npm; see DEPLOYMENT.md for why it is accepted.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  # ── Publish the image ───────────────────────────────────────────────────────
  #
  # Replaces the old "Deploy to Hetzner" job, which built on the box and swapped
  # containers there. That model cannot work now: the app runs on THREE pool
  # members behind a load balancer, so a build on one box is invisible to the
  # other two.
  #
  # CI's responsibility now ends at publishing an image. The fleet converges
  # separately (eyo-deploy: `./scripts/deploy-box.sh app-1|app-2|app-3`), which
  # means CI holds no SSH keys, no age keys and no fleet credentials at all —
  # there is nothing here for a compromised workflow to steal.
  publish:
    name: Build and publish image
    needs: [verify, audit]

    # Only trusted refs. A pull request must never reach a self-hosted runner,
    # even from a private repo. Do not add `pull_request` here.
    if: >-
      github.repository == 'eyosolutionsgh/point-of-sale' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    # Self-hosted: this repo is private, so GitHub-hosted minutes are metered and
    # image builds are the expensive part. `verify` and `audit` stay on
    # GitHub-hosted because they run on every pull request.
    runs-on: [self-hosted, linux, x64, eyo]

    permissions:
      contents: read
      packages: write # GHCR push via GITHUB_TOKEN — no PAT needed

    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # The tag IS the branch name, which is what the fleet manifest expects:
      # main -> :main (prod), staging -> :staging (demo). Rolling back is a
      # re-tag, not a manifest edit. The SHA tag is for traceability.
      - name: Derive image tags
        id: meta
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tags=${image}:${branch},${image}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Migrations ──────────────────────────────────────────────────────────────
  #
  # Run ONCE, after the image exists and before the fleet rolls, because a
  # rolling deploy briefly runs two application versions against one Neon
  # database. Migrations must therefore be expand/contract: additive changes
  # only, with drops and renames split across two releases. A destructive
  # migration here breaks the version still serving traffic.
  #
  # This needs Neon, not the fleet — so it runs GitHub-hosted with only a
  # database URL, and never touches a box.
  migrate:
    name: Apply database migrations
    needs: [publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # gate this with a required reviewer if you want a manual check

    concurrency:
      group: migrate-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the destructive-migration guard diffs this push
          # against the commit before it. At the default depth of 1 that diff
          # finds nothing and the guard passes silently — which is worse than
          # not having it, because the run goes green either way.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ── What is about to happen to the client's database ──────────────────
      # Printed before anything is applied, so the run log answers "what did
      # that deploy do to production" without anyone reconstructing it later.
      - name: Show pending migrations
        run: npx prisma migrate status || true
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # ── Refuse destructive DDL unless a human said so ─────────────────────
      #
      # Required reviewers on an environment need a paid plan, so the gate is
      # here instead — and aimed only at the migrations that can actually break
      # the live system, rather than adding friction to every deploy.
      #
      # Why destructive DDL specifically: the migration runs BEFORE the fleet
      # pulls the new image, and the pool converges one box at a time. So for a
      # few minutes the client's OLD code runs against the NEW schema. Adding a
      # column survives that. Dropping or renaming one takes the live system
      # down for real users, mid-deploy.
      #
      # Override by putting [destructive-ok] in the merge commit message. That
      # keeps the decision in git history, attributed, next to the change.
      - name: Refuse destructive migrations without an explicit override
        run: |
          before='${{ github.event.before }}'
          # A new branch or a force-push has no usable "before"; fall back to
          # the previous commit rather than diffing against nothing.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
          fi
          added=$(git diff --name-only --diff-filter=A "$before" "$GITHUB_SHA" -- 'prisma/migrations/**/*.sql' || true)
          if [ -z "$added" ]; then
            echo "No new migrations in this push."
            exit 0
          fi
          echo "New migrations:"; echo "$added" | sed 's/^/  /'
          # Word boundaries matter: "DROP" alone matches DROP INDEX and
          # DROP CONSTRAINT, which are not data loss.
          risky=$(grep -inE 'DROP[[:space:]]+(TABLE|COLUMN)|ALTER[[:space:]]+TABLE[^;]*DROP[[:space:]]+COLUMN|RENAME[[:space:]]+(TO|COLUMN)|TRUNCATE' $added || true)
          if [ -z "$risky" ]; then
            echo "All additive — proceeding."
            exit 0
          fi
          echo
          echo "DESTRUCTIVE STATEMENTS FOUND:"
          echo "$risky" | sed 's/^/  /'
          if git log -1 --pretty=%B "$GITHUB_SHA" | grep -qF '[destructive-ok]'; then
            echo
            echo "Override present in the commit message — proceeding."
            exit 0
          fi
          echo
          echo "REFUSING to apply these to the client's live database."
          echo
          echo "The migration runs before the fleet pulls the new image, and the"
          echo "pool converges one box at a time — so the OLD code will run"
          echo "against this schema for a few minutes. A dropped or renamed"
          echo "column is an outage for real users in that window."
          echo
          echo "Split it expand/contract across two releases, or if you are"
          echo "certain, put [destructive-ok] in the merge commit message."
          exit 1

      # The DIRECT (non-pooled) endpoint: DDL cannot run through a transaction
      # pooler. See DEPLOYMENT.md.
      - name: prisma migrate deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  # ── Demo migrations ─────────────────────────────────────────────────────────
  #
  # The demo has its own Neon database, so it needs its own migration run. Doing
  # this by hand does not survive contact with a second schema change: the demo
  # drifts, and the first symptom is a runtime error in front of a customer.
  #
  # STAGING_DIRECT_URL must point at the DEMO database and nothing else. If it
  # ever held the production URL, every staging push would migrate the client's
  # database from an unreviewed branch. The guard below refuses the run rather
  # than trusting that the secret was set correctly.
  migrate-staging:
    name: Apply demo database migrations
    needs: [publish]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging

    concurrency:
      group: migrate-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail closed. A missing secret must not silently skip migrations, and a
      # secret pointing at production must not run at all.
      - name: Refuse to migrate the wrong database
        env:
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          PROD_DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$STAGING_DIRECT_URL" ]; then
            echo "STAGING_DIRECT_URL is not set. Add it as a repository secret,"
            echo "pointing at the DEMO Neon database (direct, non-pooled endpoint)."
            exit 1
          fi
          if [ -n "$PROD_DIRECT_URL" ] && [ "$STAGING_DIRECT_URL" = "$PROD_DIRECT_URL" ]; then
            echo "STAGING_DIRECT_URL is identical to the production DIRECT_URL."
            echo "Refusing: a staging push would migrate the client's database."
            exit 1
          fi

      - name: prisma migrate deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}

  # The fleet is NOT converged from here. Run, one member at a time, waiting for
  # the load balancer to report each healthy before the next:
  #
  #   ./scripts/deploy-box.sh app-1
  #   ./scripts/deploy-box.sh app-2
  #   ./scripts/deploy-box.sh app-3
  #
  # Converging all three at once removes every healthy target simultaneously.
